name: package updates
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"
permissions:
  contents: write
concurrency:
  group: maintenance-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Reject non-default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Capture base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Generate update
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#update
      - name: Check generated paths
        run: bash .github/scripts/publish-update.sh check
      - name: Check package and service
        run: nix flake check path:. --print-build-logs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          gh auth setup-git
          bash .github/scripts/publish-update.sh publish
